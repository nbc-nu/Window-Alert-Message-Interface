<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff; /* Fundo totalmente branco na página inteira */
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            user-select: none;
            overflow: hidden;
            padding: 20px;
        }
        .aviso-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 500px;
            gap: 24px;
        }
        .aviso-text {
            font-size: 16px;
            line-height: 1.5;
            color: #111111;
            word-break: break-word;
            font-weight: 400;
        }
        .aviso-botoes {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        button {
            padding: 8px 24px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            transition: background-color 0.1s ease;
            min-width: 100px;
            font-weight: 500;
        }
        button.btn-primary {
            background-color: #0078d4;
            color: white;
            border: 1px solid #0078d4;
        }
        button.btn-primary:hover {
            background-color: #106ebe;
            border-color: #106ebe;
        }
        button.btn-secondary {
            background-color: #ffffff;
            color: #333333;
            border: 1px solid #cccccc;
        }
        button.btn-secondary:hover {
            background-color: #f3f3f3;
            border-color: #999999;
        }
    </style>
</head>
<body>

    <div class="aviso-layout">
        <div id="message" class="aviso-text">Carregando...</div>
        <div id="buttons-container" class="aviso-botoes">
            <!-- Injetados dinamicamente via JavaScript -->
        </div>
    </div>

    <script>
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                text: params.get('text') || 'Sem texto definido.',
                type: params.get('type') || 'texto'
            };
        }

        function saveAnswer(value) {
            let avisoData = localStorage.getItem('aviso');
            try {
                avisoData = avisoData ? JSON.parse(avisoData) : {};
            } catch (e) {
                avisoData = {};
            }

            avisoData.answer = value;
            localStorage.setItem('aviso', JSON.stringify(avisoData));
        }

        function handleAction(value) {
            saveAnswer(value);
            
            if (typeof nw !== 'undefined' && nw.Window) {
                nw.Window.get().close();
                return;
            }

            window.close();

            setTimeout(() => {
                window.location.href = "about:blank";
            }, 50);
        }

        function initDialog() {
            const { text, type } = getQueryParams();
            const messageEl = document.getElementById('message');
            const buttonsContainer = document.getElementById('buttons-container');

            messageEl.textContent = text;

            switch (type.toLowerCase()) {
                case 'confirma':
                case 'pergunta':
                    buttonsContainer.innerHTML = `
                        <button class="btn-secondary" onclick="handleAction(false)">Cancelar</button>
                        <button class="btn-primary" onclick="handleAction(true)">Confirmar</button>
                    `;
                    break;
                case 'texto':
                default:
                    buttonsContainer.innerHTML = `
                        <button class="btn-primary" onclick="handleAction(true)">OK</button>
                    `;
                    break;
            }
        }

        window.onload = initDialog;
    </script>
</body>
</html>
