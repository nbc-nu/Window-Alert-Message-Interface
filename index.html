<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff; /* Fundo 100% branco */
            color: #333333;
            height: 100vh;
            width: 100vw;
            user-select: none;
            overflow: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Garante que os botões fiquem embaixo */
        }
        .aviso-conteudo {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }
        .aviso-text {
            font-size: 15px;
            line-height: 1.5;
            color: #111111;
            word-break: break-word;
        }
        .aviso-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            outline: none;
            font-family: inherit;
        }
        .aviso-input:focus {
            border-color: #0078d4;
        }
        .aviso-botoes {
            display: flex;
            justify-content: flex-end; /* Alinha tudo no canto inferior direito */
            gap: 12px;
            width: 100%;
            margin-top: 16px;
        }
        button {
            padding: 6px 20px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            transition: background-color 0.1s ease;
            min-width: 80px;
            font-weight: 500;
        }
        button.btn-primary {
            background-color: #0078d4;
            color: white;
            border: 1px solid #0078d4;
        }
        button.btn-primary:hover {
            background-color: #106ebe;
            border-color: #106ebe;
        }
        button.btn-secondary {
            background-color: #ffffff;
            color: #333333;
            border: 1px solid #cccccc;
        }
        button.btn-secondary:hover {
            background-color: #f3f3f3;
            border-color: #999999;
        }
    </style>
</head>
<body>

    <div class="aviso-conteudo">
        <div id="message" class="aviso-text">Carregando...</div>
        <div id="input-container"></div>
    </div>

    <div id="buttons-container" class="aviso-botoes">
        <!-- Injetados via JS -->
    </div>

    <script>
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                text: params.get('text') || 'Sem texto definido.',
                type: params.get('type') || 'text',
                placeholder: params.get('placeholder') || 'Digite sua resposta aqui...'
            };
        }

        function saveAnswer(value) {
            let avisoData = localStorage.getItem('aviso');
            try {
                avisoData = avisoData ? JSON.parse(avisoData) : {};
            } catch (e) {
                avisoData = {};
            }

            avisoData.answer = value;
            localStorage.setItem('aviso', JSON.stringify(avisoData));
        }

        function handleAction(value) {
            // Se for do tipo 'ask', captura o valor do input em vez de usar true/false
            if (value === 'ASK_SUBMIT') {
                const inputEl = document.getElementById('user-input');
                saveAnswer(inputEl ? inputEl.value : '');
            } else {
                saveAnswer(value);
            }
            
            if (typeof nw !== 'undefined' && nw.Window) {
                nw.Window.get().close();
                return;
            }

            window.close();

            setTimeout(() => {
                window.location.href = "about:blank";
            }, 50);
        }

        function initDialog() {
            const { text, type, placeholder } = getQueryParams();
            const messageEl = document.getElementById('message');
            const inputContainer = document.getElementById('input-container');
            const buttonsContainer = document.getElementById('buttons-container');

            messageEl.textContent = text;

            // Limpa os containers antes de renderizar
            inputContainer.innerHTML = '';
            buttonsContainer.innerHTML = '';

            switch (type.toLowerCase()) {
                case 'confirm':
                    buttonsContainer.innerHTML = `
                        <button class="btn-secondary" onclick="handleAction(false)">Cancel</button>
                        <button class="btn-primary" onclick="handleAction(true)">OK</button>
                    `;
                    break;
                    
                case 'ask':
                    // Cria e injeta o campo de texto
                    inputContainer.innerHTML = `
                        <input type="text" id="user-input" class="aviso-input" placeholder="${placeholder}" autocomplete="off">
                    `;
                    buttonsContainer.innerHTML = `
                        <button class="btn-primary" onclick="handleAction('ASK_SUBMIT')">OK</button>
                    `;
                    
                    // Permite enviar apertando Enter dentro do input
                    setTimeout(() => {
                        const inputEl = document.getElementById('user-input');
                        if (inputEl) {
                            inputEl.focus();
                            inputEl.addEventListener('keypress', function(e) {
                                if (e.key === 'Enter') {
                                    handleAction('ASK_SUBMIT');
                                }
                            });
                        }
                    }, 50);
                    break;

                case 'text':
                default:
                    buttonsContainer.innerHTML = `
                        <button class="btn-primary" onclick="handleAction(true)">OK</button>
                    `;
                    break;
            }
        }

        window.onload = initDialog;
    </script>
</body>
</html>
